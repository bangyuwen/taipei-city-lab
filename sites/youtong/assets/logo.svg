<svg xmlns="http://www.w3.org/2000/svg" viewBox="110 100 180 240" width="180" height="240" role="img" aria-label="有桶 YOU TONG">
<style>
.yt-walk,.yt-body,.yt-lid,.yt-eyes,.yt-foot-l,.yt-foot-r,.yt-shadow{transform-box:view-box}
.yt-walk{transform-origin:200px 322px;animation:yt-waddle 1s ease-in-out infinite}
.yt-body{animation:yt-bob .5s ease-in-out infinite alternate}
.yt-lid{transform-origin:200px 172px;animation:yt-lid 1s ease-in-out infinite}
.yt-eyes{transform-origin:202px 228px;animation:yt-blink 3.6s ease-in-out infinite}
.yt-foot-l{animation:yt-step 1s ease-in-out infinite}
.yt-foot-r{animation:yt-step 1s ease-in-out infinite;animation-delay:-.5s}
.yt-shadow{transform-origin:200px 330px;animation:yt-shadow .5s ease-in-out infinite alternate}
@keyframes yt-waddle{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes yt-bob{from{transform:translateY(0)}to{transform:translateY(-7px)}}
@keyframes yt-lid{0%,50%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-10px) rotate(-7deg)}75%{transform:translateY(-10px) rotate(7deg)}}
@keyframes yt-blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
@keyframes yt-step{0%,50%,100%{transform:translateY(0)}25%{transform:translateY(-9px)}}
@keyframes yt-shadow{from{transform:scaleX(1)}to{transform:scaleX(.88)}}
@media (prefers-reduced-motion: reduce){.yt-walk,.yt-body,.yt-lid,.yt-eyes,.yt-foot-l,.yt-foot-r,.yt-shadow{animation:none}}
</style>
<ellipse class="yt-shadow" cx="200" cy="330" rx="72" ry="6" fill="#141414" opacity="0.1"/>
<g class="yt-walk">
<g class="yt-foot-l"><rect x="164" y="278" width="11" height="36" fill="#141414"/><rect x="146" y="308" width="34" height="14" rx="5" fill="#141414"/></g>
<g class="yt-foot-r"><rect x="226" y="278" width="11" height="36" fill="#141414"/><rect x="222" y="308" width="34" height="14" rx="5" fill="#141414"/></g>
<g class="yt-body">
<g class="yt-lid"><rect x="180" y="118" width="40" height="20" rx="8" fill="#0F9D76"/><rect x="118" y="136" width="164" height="36" rx="12" fill="#0F9D76"/></g>
<path d="M136 180 H264 Q274 180 273 190 L264 284 Q263 296 251 296 H149 Q137 296 136 284 L127 190 Q126 180 136 180 Z" fill="#0F9D76"/>
<g class="yt-eyes">
<ellipse cx="180" cy="228" rx="14" ry="18" fill="#FFFFFF"/><ellipse cx="222" cy="228" rx="14" ry="18" fill="#FFFFFF"/>
<ellipse cx="182" cy="230" rx="7" ry="10" fill="#141414"/><ellipse cx="224" cy="230" rx="7" ry="10" fill="#141414"/>
</g>
</g>
</g>
</svg>
