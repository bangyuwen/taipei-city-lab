<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600" role="img" aria-labelledby="title desc">
<title id="title">T1 行人垃圾桶正視提案圖</title>
<desc id="desc">提案外形寬48公分、高110公分，前方內縮投入口22乘14.3公分，中心離地82.5公分。無使用者翻蓋及踏板；下方為附右側齊平鎖把的維修門。尺寸為概念示意，非施工圖。</desc>
<style>:root{color-scheme:light;--paper:#f2f6f7;--ink:#18333b;--accent:#16566a;--steel:#dbe3e5;--white:#fff;--muted:#536d76;--dim:#6b858d} text{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;fill:var(--ink);font-size:18px}.body{fill:var(--steel);stroke:var(--accent);stroke-width:2.4}.line{fill:none;stroke:var(--accent);stroke-width:2}.dim{fill:none;stroke:var(--dim);stroke-width:1.3}.small{fill:var(--muted);font-size:18px}.accent{fill:var(--accent)} </style>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M8 0 0 4 8 8" fill="none" stroke="var(--dim)" stroke-width="1.1"/></marker></defs>
<path fill="var(--paper)" d="M0 0h480v600H0z"/>
<text x="28" y="34" font-size="21" font-weight="700">T1 ／ 正視</text><text x="452" y="34" text-anchor="end" class="small">行人垃圾桶提案</text>
