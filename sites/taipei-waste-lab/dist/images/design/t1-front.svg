<path d="M160 112H320" class="dim"/>
<text x="240" y="146" text-anchor="middle" class="accent" font-size="25" font-weight="700">T1</text>
<rect x="199.7" y="166.3" width="80.6" height="52.4" rx="2" fill="var(--accent)"/>
<path d="M205 172H275V209H205" fill="var(--white)" stroke="var(--accent)" stroke-width="1.5"/>
